name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Verify pinned CPU voice analysis
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r backend/vad/requirements.txt
          python -m unittest discover -s backend/vad -p 'test_*.py' -v
          python backend/vad/call_vad_analysis.py --doctor
      - run: bash -n install.sh start.sh
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm run typecheck && npm run build
        working-directory: backend
      - run: npm test -- --runInBand
        working-directory: backend
      - run: npm audit --omit=dev
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build && npm run lint
        working-directory: frontend
      - run: npm audit --omit=dev
        working-directory: frontend
      - run: node --test scripts/test-web-transport.cjs scripts/test-web-worker.cjs
